<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Centralizado</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(173, 193, 230);
        }

        main {
            background-color: rgb(204, 228, 70);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }

        section {
             background-color: lightgreen;
             height: 200px;
             width: 200px;
            
        }
    </style>
</head>
<body>
    <main>
    <section>tela de login</section>
    </main>
</body>
</html>
